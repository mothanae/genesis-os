services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: genesis1
      POSTGRES_USER: genesis1
      POSTGRES_PASSWORD: genesis1_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genesis1"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://genesis1:genesis1_dev@postgres:5432/genesis1
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-me-at-least-32-characters
      API_PORT: "3001"
      CORS_ORIGIN: http://localhost:3000
      LOG_LEVEL: debug
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: pnpm --filter @genesis-1/api dev
    profiles: ["all", "api"]

  next:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001/ws
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - api
    command: pnpm --filter @genesis-1/next dev
    profiles: ["all", "next"]

  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      - redis
    profiles: ["tools"]

volumes:
  pgdata:
  redisdata:
