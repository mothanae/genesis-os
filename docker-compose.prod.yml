services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: always

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "${API_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      API_PORT: "${API_PORT:-3001}"
      CORS_ORIGIN: ${CORS_ORIGIN}
      LOG_LEVEL: info
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    restart: always
    profiles: ["all", "api"]

  next:
    build:
      context: .
      dockerfile: docker/Dockerfile.next
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    env_file:
      - .env
    depends_on:
      - api
    restart: always
    profiles: ["all", "next"]

volumes:
  pgdata:
  redisdata:
